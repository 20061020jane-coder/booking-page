<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约我的空闲时间</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #ECF0F1;
            --gradient: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; background: var(--light); overflow-x: hidden; }
        .container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--gradient); position: relative; }
        .container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.5; }
        .card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); padding: 40px; max-width: 400px; width: 100%; position: relative; z-index: 1; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--dark); text-align: center; margin-bottom: 30px; line-height: 1.4; }
        .question { font-size: 18px; color: var(--dark); text-align: center; margin-bottom: 30px; font-weight: 500; }
        .buttons { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; position: relative; height: 100px; }
        .btn { padding: 14px 32px; border: none; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif; }
        .btn-yes { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4); }
        .btn-yes:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5); }
        .btn-no { background: var(--dark); color: white; position: absolute; transition: all 0.1s ease; }
        .form { display: none; }
        .form.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--dark); margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 14px 16px; border: 2px solid var(--light); border-radius: 12px; font-size: 16px; transition: border-color 0.3s ease; font-family: 'Noto Sans SC', sans-serif; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--secondary); }
        .submit-btn { width: 100%; padding: 16px; background: var(--gradient); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; font-family: 'Noto Sans SC', sans-serif; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4); }
        .invitation { display: none; text-align: center; animation: scaleIn 0.5s ease; }
        .invitation.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .invitation-icon { font-size: 60px; margin-bottom: 20px; }
        .invitation-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--primary); margin-bottom: 20px; }
        .invitation-content { font-size: 16px; color: var(--dark); line-height: 1.8; background: var(--light); padding: 24px; border-radius: 16px; margin-bottom: 24px; }
        .invitation-content strong { color: var(--primary); }
        .back-btn { padding: 12px 24px; background: transparent; border: 2px solid var(--dark); border-radius: 50px; font-size: 14px; color: var(--dark); cursor: pointer; transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif; }
        .back-btn:hover { background: var(--dark); color: white; }
        .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; padding: 30px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); z-index: 100; text-align: center; transition: transform 0.3s ease; }
        .popup.active { transform: translate(-50%, -50%) scale(1); }
        .popup-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }
        .popup-text { font-size: 18px; color: var(--dark); margin-bottom: 20px; font-weight: 500; }
        .popup-btn { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 50px; font-size: 14px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif; }
        .hidden { display: none; }
        .initial-screen { display: flex; flex-direction: column; align-items: center; }
        .moving { animation: moveAround 2s infinite linear; }
        @keyframes moveAround { 0% { transform: translate(0, 0); } 25% { transform: translate(80px, 30px); } 50% { transform: translate(0, 60px); } 75% { transform: translate(-80px, 30px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div id="initialScreen" class="initial-screen">
                <h1 class="title">预约我的空闲时间</h1>
                <p class="question">你要预约我的空闲时间吗？</p>
                <div class="buttons">
                    <button class="btn btn-yes" onclick="showForm()">要</button>
                    <button id="noBtn" class="btn btn-no" onclick="showPopup()">不要</button>
                </div>
            </div>
            <div id="formScreen" class="form">
                <h2 class="title">填写预约信息</h2>
                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" id="name" placeholder="请输入您的姓名">
                </div>
                <div class="form-group">
                    <label>预约时间</label>
                    <input type="datetime-local" id="time">
                </div>
                <div class="form-group">
                    <label>预约事项</label>
                    <select id="activity">
                        <option value="">请选择事项</option>
                        <option value="喝咖啡">喝咖啡</option>
                        <option value="看电影">看电影</option>
                        <option value="吃饭">吃饭</option>
                        <option value="逛街">逛街</option>
                        <option value="运动">运动</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <button class="submit-btn" onclick="generateInvitation()">生成邀请函</button>
            </div>
            <div id="invitationScreen" class="invitation">
                <div class="invitation-icon">🎉</div>
                <h2 class="invitation-title">预约成功！</h2>
                <div class="invitation-content" id="invitationContent"></div>
                <button class="back-btn" onclick="resetForm()">返回</button>
            </div>
        </div>
    </div>
    <div class="popup-overlay" id="popupOverlay" onclick="closePopup()"></div>
    <div class="popup" id="popup">
        <p class="popup-text">真的不要吗？再想想吧。</p>
        <button class="popup-btn" onclick="closePopup()">我知道了</button>
    </div>
    <script>
        let noClickCount = 0;
        function showPopup() {
            document.getElementById('popupOverlay').classList.add('active');
            document.getElementById('popup').classList.add('active');
            noClickCount++;
            if (noClickCount >= 1) {
                const noBtn = document.getElementById('noBtn');
                noBtn.classList.add('moving');
                noBtn.style.pointerEvents = 'none';
            }
        }
        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
            document.getElementById('popup').classList.remove('active');
        }
        function showForm() {
            document.getElementById('initialScreen').classList.add('hidden');
            document.getElementById('formScreen').classList.add('active');
        }
        function generateInvitation() {
            const name = document.getElementById('name').value;
            const time = document.getElementById('time').value;
            const activity = document.getElementById('activity').value;
            if (!name || !time || !activity) { alert('请填写完整信息'); return; }
            const formattedTime = new Date(time).toLocaleString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            const content = `<p>亲爱的<strong>${name}</strong>，</p><p>您成功预约了<strong>Jane</strong>的</p><p><strong>${formattedTime}</strong></p><p>一起去<strong>${activity}</strong></p><p style="margin-top: 20px; font-size: 14px; color: #666;">期待与您相见！✨</p>`;
            document.getElementById('invitationContent').innerHTML = content;
            document.getElementById('formScreen').classList.remove('active');
            document.getElementById('invitationScreen').classList.add('active');
        }
        function resetForm() {
            document.getElementById('invitationScreen').classList.remove('active');
            document.getElementById('initialScreen').classList.remove('hidden');
            document.getElementById('name').value = '';
            document.getElementById('time').value = '';
            document.getElementById('activity').value = '';
        }
    </script>
</body>
</html>
